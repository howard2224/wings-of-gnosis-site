name: Extract site package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site package
        run: |
          if [ ! -f wog-website.zip ]; then echo "No zip to extract"; exit 0; fi
          unzip -o wog-website.zip
          rm wog-website.zip
      - name: Commit extracted files
        run: |
          git config user.name "howard2224"
          git config user.email "howard2224@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Wings of Gnosis site files"
          git push
